server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: market-pricing-route
              uri: http://localhost:8081
              predicates:
                - Path=/api/market/**
            - id: card-catalog-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/catalog/**
            - id: user-identity-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/auth/**
